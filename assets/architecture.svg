<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" role="img" aria-label="Inference pipeline of Cosmos Policy 2B compared with SmolWAM">

<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; }
