    .ours { fill: #4493f8; }
    .teach-tint { fill: #2b1a10; stroke: #f0763a; }
    .ours-tint { fill: #0f2340; stroke: #4493f8; }
    .badge-t { fill: #d9561f; }
    .badge-o { fill: #2f74d0; }
    .gone { fill: #151b23; stroke: #3d444d; }
    .gone-text { fill: #656c76; }
    .cond { fill: #262c36; }
    .gen { fill: #13305a; }
    .act { fill: #4493f8; }
    .hatch-line { stroke: #3d444d; }
    .hatch-bg { fill: #151b23; }
